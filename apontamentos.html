<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apontamento de Chão de Fábrica - MES</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wide">MES - Terminal do Operador</h1>
            <p class="text-xs text-slate-400">Lavanderia Industrial • Entrada de Dados</p>
        </div>
        <div id="status-conexao" class="text-xs bg-green-500 text-white px-3 py-1 rounded-full font-semibold">
            Conectado ao Servidor
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-6">
        
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="mudarAba('peso')" id="tab-peso" class="aba-btn active bg-blue-600 text-white p-4 rounded-lg font-bold text-center shadow transition text-sm sm:text-base">
                ⚖️ Peso / Produção
            </button>
            <button onclick="mudarAba('utilidades')" id="tab-utilidades" class="aba-btn bg-white text-gray-700 p-4 rounded-lg font-bold text-center shadow hover:bg-gray-50 transition text-sm sm:text-base">
                💧 Utilidades
            </button>
            <button onclick="mudarAba('quimicos')" id="tab-quimicos" class="aba-btn bg-white text-gray-700 p-4 rounded-lg font-bold text-center shadow hover:bg-gray-50 transition text-sm sm:text-base">
                🧪 Químicos
            </button>
        </div>

        <div id="mensagem-alerta" class="hidden mb-4 p-4 rounded-lg text-white font-medium text-center"></div>

        <section id="form-peso" class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">Apontamento de Recepção e Expedição</h2>
            <form onsubmit="salvarApontamento(event, '/api/apontamento')">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Data da Operação</label>
                        <input type="date" required id="peso_data" value="2026-07-24" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Cliente / Lote (Opcional)</label>
                        <input type="text" placeholder="Ex: Hospital Central - Lote 01" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Peso Coletado - Sujo (Kg)</label>
                        <input type="number" step="0.01" required placeholder="0.00" id="peso_coleta" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg font-bold text-blue-900 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Peso Entregue - Limpo (Kg)</label>
                        <input type="number" step="0.01" required placeholder="0.00" id="peso_entrega" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg font-bold text-green-900 focus:border-blue-500 focus:outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg text-lg shadow transition">
                    💾 Registrar Pesagem
                </button>
            </form>
        </section>

        <section id="form-utilidades" class="bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">Leitura de Hidrômetros e Medidores</h2>
            <form onsubmit="salvarApontamento(event, '/api/utilidades')">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Data da Leitura</label>
                        <input type="date" required id="util_data" value="2026-07-24" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Hidrômetro Poço 1 (L)</label>
                        <input type="number" step="0.1" placeholder="0.0" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Hidrômetro Túnel 1 (L)</label>
                        <input type="number" step="0.1" placeholder="0.0" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Medidor Gás (m³)</label>
                        <input type="number" step="0.01" placeholder="0.00" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg focus:border-blue-500 focus:outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg text-lg shadow transition">
                    💾 Registrar Utilidades
                </button>
            </form>
        </section>

        <section id="form-quimicos" class="bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">Dosagem de Insumos Químicos</h2>
            <form onsubmit="salvarApontamento(event, '/api/quimicos')">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Data</label>
                    <input type="date" required id="quim_data" value="2026-07-24" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg focus:border-blue-500 focus:outline-none">
                </div>
                <div class="space-y-4 mb-6">
                    <div class="flex items-center justify-between border-b pb-2">
                        <span class="font-semibold text-gray-700">BEICLEAN CWT (Detergente)</span>
                        <input type="number" step="0.1" placeholder="Litros" class="w-32 border-2 border-gray-300 rounded-lg p-2 text-right font-bold focus:border-blue-500 focus:outline-none">
                    </div>
                    <div class="flex items-center justify-between border-b pb-2">
                        <span class="font-semibold text-gray-700">BEIPUR MSC (Alcalino)</span>
                        <input type="number" step="0.1" placeholder="Litros" class="w-32 border-2 border-gray-300 rounded-lg p-2 text-right
