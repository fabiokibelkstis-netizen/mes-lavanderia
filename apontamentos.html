<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES - Apontamento de Produção</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 text-white p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wider">MES - Lavanderia Dona Zara</h1>
                <p class="text-xs text-slate-400">Terminal de Apontamento Operacional</p>
            </div>
            <span class="bg-green-500 text-slate-900 text-xs font-extrabold px-3 py-1 rounded-full uppercase">Online</span>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-4 my-8">
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-6 text-center border-b pb-3">Registro de Pesagem Diária</h2>
            
            <form id="formApontamento" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Data da Operação</label>
                    <input type="date" id="data" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 font-medium">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Peso Coletado (Sujo - Kg)</label>
                    <input type="number" step="0.01" id="pesoColeta" placeholder="Ex: 1250.50" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 text-lg font-bold">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Peso Entregue (Limpo - Kg)</label>
                    <input type="number" step="0.01" id="pesoEntrega" placeholder="Ex: 1180.20" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 text-lg font-bold">
                </div>

                <button type="submit" id="btnSalvar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
                    <span>💾 Registrar Pesagem</span>
                </button>
            </form>

            <div id="statusMessage" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-semibold"></div>
        </div>
    </main>

    <footer class="text-center p-4 text-xs text-slate-500 border-t bg-white">
        MES Dona Zara &copy; 2026 - Conectado à Nuvem (Render / Supabase)
    </footer>

    <script>
        // Definir data atual como padrão
        document.getElementById('data').valueAsDate = new Date();

        const form = document.getElementById('formApontamento');
        const statusMsg = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                data: document.getElementById('data').value,
                pesoColeta: parseFloat(document.getElementById('pesoColeta').value),
                pesoEntrega: parseFloat(document.getElementById('pesoEntrega').value)
            };

            statusMsg.className = "mt-4 p-3 rounded-lg text-sm text-center font-semibold bg-blue-100 text-blue-800 block";
            statusMsg.innerText = "A enviar dados para a nuvem...";

            try {
                const response = await fetch('https://mes-lavanderia-api.onrender.com/api/apontamento', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();

                if (response.ok) {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-sm text-center font-semibold bg-green-100 text-green-800 block";
                    statusMsg.innerText = "✅ " + resultado.mensagem;
                    form.reset();
                    document.getElementById('data').valueAsDate = new Date();
                } else {
                    throw new Error(resultado.mensagem || "Erro ao salvar");
                }
            } catch (err) {
                statusMsg.className = "mt-4 p-3 rounded-lg text-sm text-center font-semibold bg-red-100 text-red-800 block";
                statusMsg.innerText = "❌ Erro: " + err.message;
            }
        });
    </script>
</body>
</html>
