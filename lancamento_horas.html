<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES - Lançamento de Horas | Lavanderia Dona Zara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between text-slate-800">

    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-amber-600 p-2.5 rounded-xl text-white shadow">
                    <i class="fa-solid fa-clock text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Apontamento de Horas</h1>
                    <p class="text-xs text-slate-400">Lançamento diário de jornada de trabalho</p>
                </div>
            </div>
            <a href="gestaodehoras.html" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition border border-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
        </div>
    </header>

    <main class="max-w-xl mx-auto w-full p-4 md:p-6 space-y-6 flex-grow">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <h3 class="text-sm font-bold text-slate-800 border-b pb-3 flex items-center justify-between" id="tituloForm">
                <span><i class="fa-solid fa-pen-to-square text-amber-600 mr-2"></i>Novo Registro de Horas</span>
                <span id="badgeModo" class="hidden text-xs bg-amber-100 text-amber-800 font-semibold px-2.5 py-0.5 rounded-full">Modo de Edição</span>
            </h3>

            <form id="formHoras" onsubmit="salvarLancamento(event)" class="flex flex-col gap-4">
                <input type="hidden" id="editIndex" value="">

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Data *</label>
                    <input type="date" id="data" required class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 font-bold text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Horas Normais *</label>
                    <input type="number" step="0.1" id="normais" required placeholder="Ex: 8.0" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 font-bold text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Horas Extras</label>
                    <input type="number" step="0.1" id="extras" placeholder="Ex: 2.0" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 font-bold text-amber-600 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Absenteísmo (Faltas / Horas Off)</label>
                    <input type="number" step="0.1" id="absenteismo" placeholder="Ex: 0.0" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 font-bold text-rose-600 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Setor / Observações</label>
                    <input type="text" id="obs" placeholder="Ex: Setor de Lavagem / Turno Manhã" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none transition">
                </div>

                <div class="flex gap-3 pt-3">
                    <button type="button" onclick="limparForm()" class="w-1/3 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition">
                        Limpar / Cancelar
                    </button>
                    <button type="submit" id="btnSalvar" class="w-2/3 py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow transition">
                        Salvar Lançamento
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-center py-4 text-xs border-t border-slate-800">
        Lavanderia Dona Zara &copy; MES System 2026
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Define data padrão de hoje se for novo registro
            if (!document.getElementById('data').value) {
                document.getElementById('data').valueAsDate = new Date();
            }
            verificarEdicaoURL();
        });

        function obteerLancamentosLocais() {
            return JSON.parse(localStorage.getItem('mes_lancamentos_horas') || localStorage.getItem('mes_historico_horas') || '[]');
        }

        function salvarLancamentosLocais(dados) {
            localStorage.setItem('mes_lancamentos_horas', JSON.stringify(dados));
            localStorage.setItem('mes_historico_horas', JSON.stringify(dados));
        }

        function verificarEdicaoURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const editIndex = urlParams.get('editIndex');

            if (editIndex !== null && editIndex !== '') {
                const lancamentos = obteerLancamentosLocais();
                const item = lancamentos[editIndex];

                if (item) {
                    document.getElementById('editIndex').value = editIndex;
                    document.getElementById('data').value = item.data || '';
                    document.getElementById('normais').value = item.normais !== undefined ? item.normais : (item.horasNormais || '');
                    document.getElementById('extras').value = item.extras !== undefined ? item.extras : (item.horasExtras || '');
                    document.getElementById('absenteismo').value = item.absenteismo || '';
                    document.getElementById('obs').value = item.obs || item.observacoes || '';

                    // Ajusta títulos da tela para o Modo de Edição
                    document.getElementById('tituloForm').querySelector('span').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-600 mr-2"></i>Editar Lançamento de Horas';
                    document.getElementById('badgeModo').classList.remove('hidden');
                    document.getElementById('btnSalvar').innerText = "Atualizar Lançamento";
                    document.getElementById('btnSalvar').className = "w-2/3 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow transition";
                }
            }
        }

        function salvarLancamento(e) {
            e.preventDefault();
            const idx = document.getElementById('editIndex').value;
            let lancamentos = obteerLancamentosLocais();

            const normaisVal = parseFloat(document.getElementById('normais').value) || 0;
            const extrasVal = parseFloat(document.getElementById('extras').value) || 0;

            const registro = {
                id: idx !== "" ? (lancamentos[idx] ? lancamentos[idx].id : Date.now().toString()) : Date.now().toString(),
                data: document.getElementById('data').value,
                normais: normaisVal,
                horasNormais: normaisVal,
                extras: extrasVal,
                horasExtras: extrasVal,
                absenteismo: parseFloat(document.getElementById('absenteismo').value) || 0,
                totais: normaisVal + extrasVal,
                obs: document.getElementById('obs').value
            };

            if (idx !== "" && lancamentos[idx]) {
                lancamentos[idx] = registro;
                salvarLancamentosLocais(lancamentos);
                alert("Lançamento atualizado com sucesso!");
            } else {
                lancamentos.unshift(registro);
                salvarLancamentosLocais(lancamentos);
                alert("Lançamento efetuado com sucesso!");
            }

            window.location.href = "gestaodehoras.html";
        }

        function limparForm() {
            document.getElementById('formHoras').reset();
            document.getElementById('editIndex').value = "";
            document.getElementById('data').valueAsDate = new Date();
            document.getElementById('badgeModo').classList.add('hidden');
            document.getElementById('tituloForm').querySelector('span').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-600 mr-2"></i>Novo Registro de Horas';
            document.getElementById('btnSalvar').innerText = "Salvar Lançamento";
            document.getElementById('btnSalvar').className = "w-2/3 py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow transition";
        }
    </script>
</body>
</html>
