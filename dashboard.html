<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES - Dashboard Gerencial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <header class="bg-slate-900 text-white p-4 shadow-md flex flex-wrap justify-between items-center px-8 gap-4">
        <div>
            <h1 class="text-xl font-bold tracking-wide">MES - Painel Gerencial</h1>
            <p class="text-xs text-slate-400">Lavanderia Dona Zara - Indicadores em Tempo Real</p>
        </div>
        <div class="flex items-center gap-3">
            <input type="date" id="filtro_data" onchange="carregarDashboard()" class="text-gray-800 p-2 rounded border focus:outline-none font-semibold">
            <button onclick="carregarDashboard()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold transition flex items-center gap-1">
                🔄 <span>Atualizar</span>
            </button>
        </div>
    </header>

    <main class="p-8 max-w-7xl mx-auto space-y-8">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-600">
                <span class="text-xs text-gray-500 uppercase font-bold">Peso Coletado</span>
                <p id="kpi_coleta" class="text-3xl font-extrabold text-gray-800 mt-2">-- <span class="text-base font-normal">Kg</span></p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-600">
                <span class="text-xs text-gray-500 uppercase font-bold">Peso Entregue</span>
                <p id="kpi_entrega" class="text-3xl font-extrabold text-gray-800 mt-2">-- <span class="text-base font-normal">Kg</span></p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-indigo-600">
                <span class="text-xs text-gray-500 uppercase font-bold">Rendimento (Yield)</span>
                <p id="kpi_retorno" class="text-3xl font-extrabold text-gray-800 mt-2">--%</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-red-600">
                <span class="text-xs text-gray-500 uppercase font-bold">Não Conformidade</span>
                <p id="kpi_nc" class="text-3xl font-extrabold text-gray-800 mt-2">--%</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-base font-bold text-gray-700 mb-4">Balanço de Pesagem (Kg)</h3>
                <canvas id="chartPesagem" height="150"></canvas>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-base font-bold text-gray-700 mb-4">Indicadores de Qualidade (%)</h3>
                <canvas id="chartQualidade" height="150"></canvas>
            </div>
        </div>

    </main>

    <script>
        // Define a data de hoje por padrão
        document.getElementById('filtro_data').valueAsDate = new Date();

        let chartPesagem, chartQualidade;

        async function carregarDashboard() {
            const data = document.getElementById('filtro_data').value;

            try {
                const res = await fetch(`https://mes-lavanderia-api.onrender.com/api/metrics/${data}`);
                
                if (!res.ok) {
                    throw new Error('Nenhum dado encontrado para esta data.');
                }
                
                const metricas = await res.json();

                // Atualizar Cards
                const coleta = parseFloat(metricas.peso_coleta_kg || 0);
                const entrega = parseFloat(metricas.peso_entrega_kg || 0);
                const retorno = parseFloat(metricas.retorno_perc || 0);
                const nc = parseFloat(metricas.nc_perc || 0);

                document.getElementById('kpi_coleta').innerText = coleta.toLocaleString('pt-BR') + ' Kg';
                document.getElementById('kpi_entrega').innerText = entrega.toLocaleString('pt-BR') + ' Kg';
                document.getElementById('kpi_retorno').innerText = retorno.toFixed(1) + '%';
                document.getElementById('kpi_nc').innerText = nc.toFixed(2) + '%';

                // Renderizar Gráficos
                atualizarGraficos(coleta, entrega, retorno, nc);

            } catch (err) {
                console.warn(err.message);
                document.getElementById('kpi_coleta').innerText = '0 Kg';
                document.getElementById('kpi_entrega').innerText = '0 Kg';
                document.getElementById('kpi_retorno').innerText = '0%';
                document.getElementById('kpi_nc').innerText = '0%';
                atualizarGraficos(0, 0, 0, 0);
            }
        }

        function atualizarGraficos(coleta, entrega, retorno, nc) {
            if (chartPesagem) chartPesagem.destroy();
            if (chartQualidade) chartQualidade.destroy();

            const ctxPesagem = document.getElementById('chartPesagem').getContext('2d');
            chartPesagem = new Chart(ctxPesagem, {
                type: 'bar',
                data: {
                    labels: ['Coletado (Sujo)', 'Entregue (Limpo)'],
                    datasets: [{
                        label: 'Quilogramas (Kg)',
                        data: [coleta, entrega],
                        backgroundColor: ['#2563eb', '#16a34a']
                    }]
                },
                options: { responsive: true }
            });

            const ctxQualidade = document.getElementById('chartQualidade').getContext('2d');
            chartQualidade = new Chart(ctxQualidade, {
                type: 'doughnut',
                data: {
                    labels: ['Rendimento OK', 'Perda / NC'],
                    datasets: [{
                        data: [retorno, nc],
                        backgroundColor: ['#4f46e5', '#dc2626']
                    }]
                },
                options: { responsive: true }
            });
        }

        // Carregar dados na abertura da página
        carregarDashboard();
    </script>
</body>
</html>
