<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Módulo Químico - Medição e Consumo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="border-b pb-4 border-gray-200">
      <span class="text-xs font-semibold text-emerald-600 uppercase">Módulo de Produtos Químicos</span>
      <h1 class="text-2xl font-bold text-gray-900">Lançamento de Medição / Consumo Diário</h1>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
      <form id="form-consumo" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Produto Químico / Tanque *</label>
            <select id="select-produto" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Data/Hora da Leitura *</label>
            <input type="datetime-local" id="data_leitura" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>

        <div id="painel-info" class="hidden bg-emerald-50 border border-emerald-200 rounded-md p-4 flex justify-between items-center">
          <div>
            <span class="text-xs font-bold text-emerald-800 uppercase">Última Leitura Registrada</span>
            <p id="info-leitura" class="text-sm text-emerald-900 font-medium"></p>
          </div>
          <div class="text-xs text-emerald-700 bg-white px-3 py-1.5 rounded border border-emerald-200">
            Custo Última NF: <strong id="info-custo">R$ 0,00</strong>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nível Atual Medido no Tanque *</label>
          <input type="number" step="0.001" id="nivel_medido" required placeholder="Ex: 850.00" class="w-full border border-gray-300 rounded-md p-3 text-lg font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div class="flex justify-end">
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-6 py-2.5 rounded-md transition-colors">Confirmar e Registrar Consumo</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let dadosProdutoAtual = null;

    async function carregarProdutos() {
      const res = await fetch('/api/configuracoes/produtos');
      const produtos = await res.json();
      const select = document.getElementById('select-produto');
      select.innerHTML = '<option value="">Selecione o produto das configurações...</option>';
      produtos.forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.nome} (${p.tanque_nome})</option>`;
      });
    }

    document.getElementById('select-produto').addEventListener('change', async (e) => {
      const pId = e.target.value;
      if (!pId) return;

      const res = await fetch(`/api/leituras/ultima/${pId}`);
      dadosProdutoAtual = await res.json();

      const painel = document.getElementById('painel-info');
      painel.classList.remove('hidden');

      if (dadosProdutoAtual.ultima_leitura) {
        document.getElementById('info-leitura').textContent = 
          `Data: ${dadosProdutoAtual.ultima_leitura.data_leitura} — Nível: ${dadosProdutoAtual.ultima_leitura.nivel_medido}`;
      } else {
        document.getElementById('info-leitura').textContent = 'Nenhuma leitura prévia encontrada (Será o nível inicial)';
      }

      document.getElementById('info-custo').textContent = 
        dadosProdutoAtual.ultimo_custo_unitario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    });

    document.getElementById('form-consumo').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        produto_id: document.getElementById('select-produto').value,
        data_leitura: document.getElementById('data_leitura').value,
        nivel_medido: document.getElementById('nivel_medido').value
      };

      const res = await fetch('/api/leituras', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (res.ok) {
        alert(data.message);
        location.reload();
      } else {
        alert('Erro: ' + data.error);
      }
    });

    carregarProdutos();
  </script>
</body>
</html>
