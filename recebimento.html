<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Módulo Químico - Recebimento de Produtos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="border-b pb-4 border-gray-200">
      <span class="text-xs font-semibold text-blue-600 uppercase">Módulo de Produtos Químicos</span>
      <h1 class="text-2xl font-bold text-gray-900">Lançamento de Recebimento (Entrada NF)</h1>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
      <form id="form-recebimento" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Produto Químico / Tanque *</label>
            <select id="select-produto" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Data do Recebimento *</label>
            <input type="date" id="data_recebimento" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Número da NF *</label>
            <input type="text" id="numero_nf" required placeholder="Ex: NF-10293" class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Quantidade Recebida *</label>
            <input type="number" step="0.001" id="quantidade" required placeholder="0.000" class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Valor Unitário da NF (R$) *</label>
            <input type="number" step="0.01" id="valor_unitario" required placeholder="0,00" class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="bg-gray-50 p-4 rounded-md border border-gray-200 flex justify-between items-center">
          <div>
            <p class="text-xs text-gray-500 uppercase font-semibold">Valor Total Calculado da Nota</p>
            <p id="total-nf" class="text-2xl font-bold text-gray-900">R$ 0,00</p>
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-6 py-2.5 rounded-md transition-colors">Salvar Recebimento</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function carregarProdutos() {
      const res = await fetch('/api/configuracoes/produtos');
      const produtos = await res.json();
      const select = document.getElementById('select-produto');
      select.innerHTML = '<option value="">Selecione o produto das configurações...</option>';
      produtos.forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.nome} (${p.tanque_nome}) - [Unidade: ${p.unidade_medida}]</option>`;
      });
    }

    const qtdInput = document.getElementById('quantidade');
    const valorInput = document.getElementById('valor_unitario');
    const totalDisplay = document.getElementById('total-nf');

    function calcularTotal() {
      const q = parseFloat(qtdInput.value) || 0;
      const v = parseFloat(valorInput.value) || 0;
      totalDisplay.textContent = (q * v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    qtdInput.addEventListener('input', calcularTotal);
    valorInput.addEventListener('input', calcularTotal);

    document.getElementById('form-recebimento').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        produto_id: document.getElementById('select-produto').value,
        data_recebimento: document.getElementById('data_recebimento').value,
        numero_nf: document.getElementById('numero_nf').value,
        quantidade: qtdInput.value,
        valor_unitario: valorInput.value
      };
      const res = await fetch('/api/recebimentos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        alert('Recebimento salvo e estoque/custo atualizados com sucesso!');
        location.reload();
      }
    });

    carregarProdutos();
  </script>
</body>
</html>
